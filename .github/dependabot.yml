version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Angular packages must move together (they pin each other's exact version).
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "ng-packagr"
          - "angular-eslint"
          - "@angular-eslint/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @angular/build pins the vitest major it supports (^4 for Angular 22);
      # a vitest major bump has to wait for the matching Angular release.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Angular pins the TypeScript range too (>=6.0 <6.1 for Angular 22).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
